# ==============================================================================
# Roman ePSF Pipeline - High-Throughput CPU / Memory Server Configuration
# Optimized for 56-60 CPU Cores & Large Memory Footprint (e.g. 500GB RAM)
# ==============================================================================

pipeline:
  name: "romanepsf"
  version: "0.1.0"
  integrity_mode: "production"
  log_level: "INFO"
  random_seed: 42

environment:
  device: "cpu"                # 'cpu' for large CPU server, or 'cuda' / 'mps' for GPU acceleration
  num_workers: 56              # Parallel worker processes (scale to CPU core count)
  memory_fraction: 0.85        # Memory headroom fraction for process pool

data:
  detectors_dir: "/Users/pmsanch1/storage/ROMAN/simulated_comissioning/PID1083/detectors"
  catalog_path: "/Users/pmsanch1/storage/ROMAN/simulated_comissioning/PID1083/detectors/code/r0108301001001001001_0001_wfi_source_catalog.csv"
  output_dir: "output"
  cache_dir: "cache"
  gaia_cache_dir: "cache/gaia_healpix"
  file_list: null              # Path to text file listing input L2 ASDF paths
  sca: "wfi01"                 # Target SCA (1 model per SCA)
  filter_name: "F146"
  detectors: ["wfi01"]

catalog:
  mag_col: "mag_lambda"        # Magnitude column in catalog
  use_cached_gaia: true        # Use local HEALPix Parquet cache (< 2ms queries)
  query_gaia_fallback: true    # Fetch missing tiles via single-threaded rate-limited TAP
  isolation_safety_factor: 1.3
  min_dist_arcsec: 2.0
  edge_margin_px: 50
  centroid_box_fraction: 0.30 # 30% of region size for faint, medium, and bright
  centroid_refine_box_px: null
  roundtrip_tolerance_arcsec: 0.5

tiers:
  bright_limit: 11.0
  faint_limit: 13.0
  max_stars_per_tier:
    bright: 200                # Reservoir capacity for bright stars (extended wings & spikes)
    medium: 1000               # Reservoir capacity for medium stars (transition zone)
    faint: 3000                # Reservoir capacity for faint stars (unsaturated core)

stamps:
  sizes:
    bright_max: 1001           # Adaptive bright stamp dimension
    medium: 201                # Medium stamp dimension
    faint: 81                  # Faint stamp dimension
  subpixel_interpolation_order: 3
  dq_flags_to_mask: ["DO_NOT_USE", "SATURATED", "DROPOUT"]
  faint_core_protect_finite: true

spikes:
  spike_order: "both"
  base_angles_deg: [23.55, 55.29, 80.25, 118.65, 142.88, 178.07]
  detector_alignment_offset_deg: -9.70
  angular_half_width_deg: 4.0
  spike_width_px: 4.0
  core_protection_radius_px:
    bright: 6.0
    medium: 4.0
    faint: 3.0
  morphological:
    threshold_sigma: 2.0
    min_length_px: 15
    dilation_iterations: 2
  contaminant_detection_sigma: 3.0
  contaminant_detector: "mto2"
  mto2:
    s_sigma: 1.6
    alpha: 1.0e-6
    move_factor: 0.1
    area_ratio: 0.90
    dilation_px: 2

profile:
  ellipticity: 0.0
  position_angle: 0.0
  sigma_clip: 3.0
  max_clip_iters: 5
  radial_step_px: 1.0
  num_workers: 16

assembly:
  canvas_size: 1025            # Canvas dimension (odd integer: 1025 or 2049)
  stack_sigma_clip: 3.0
  oversampling_faint: 4        # 4x oversampling for faint core
  oversampling_medium: 4       # 4x oversampling for medium transition
  overlap_fm:
    r_min: 8.0
    r_max: 16.0
    blend_start: 10.0
    blend_end: 18.0
  overlap_mb:
    r_min: 22.0
    r_max: 45.0
    blend_start: 30.0
    blend_end: 48.0
  normalize_flux: true

validation:
  eval_stars_per_tier: 5
  core_radius_max_px: 10.0
  transition_radius_px: [10.0, 30.0]
  wings_radius_min_px: 30.0
  regularization_sigma: 3.0

reporting:
  generate_pdf: true
  report_path: "output/roman_epsf_wfi01_report.pdf"
  dpi: 300
