# ==============================================================================
# Roman Space Telescope Extended PSF (ePSF) Measurement Pipeline Configuration
# ==============================================================================

pipeline:
  name: "romanepsf"
  version: "0.1.0"
  integrity_mode: "development"
  log_level: "INFO"
  random_seed: 42

environment:
  device: "auto"              # Options: 'auto' (MPS -> CUDA -> CPU), 'mps', 'cuda', 'cpu'
  num_workers: 4              # Worker processes for detector multiprocessing
  memory_fraction: 0.70       # Dynamic memory budget fraction

data:
  detectors_dir: "/Users/pmsanch1/storage/ROMAN/simulated_comissioning/PID1083/detectors"
  catalog_path: "/Users/pmsanch1/storage/ROMAN/simulated_comissioning/PID1083/detectors/code/r0108301001001001001_0001_wfi_source_catalog.csv"
  output_dir: "output"
  cache_dir: "cache"
  filter_name: "F146"
  detectors: ["wfi01"]        # Options: ["wfi01"], or ["all"], or explicit list ["wfi01", ..., "wfi18"]

catalog:
  mag_col: "mag_lambda"       # Synthetic Roman F146 magnitude column
  use_cached_gaia: true
  query_gaia_fallback: true
  isolation_safety_factor: 1.3
  min_dist_arcsec: 2.0
  edge_margin_px: 50
  centroid_refine_box_px: 5
  roundtrip_tolerance_arcsec: 0.5

tiers:
  bright_limit: 11.0          # F146 < 11.0: Extended Wings & 6-fold Diffraction Spikes
  faint_limit: 13.0           # 11.0 <= F146 < 13.0: Transition Overlap; F146 >= 13.0: Unsaturated Core
  max_stars_per_tier:
    bright: 20
    medium: 50
    faint: 100

stamps:
  sizes:
    bright_max: 1001          # Maximum adaptive bright cutout ceiling (odd integer)
    medium: 201               # Medium star cutout size (odd integer)
    faint: 81                 # Faint star cutout size (odd integer)
  subpixel_interpolation_order: 3
  dq_flags_to_mask: ["DO_NOT_USE", "SATURATED", "DROPOUT"]
  faint_core_protect_finite: true

spikes:
  spike_order: "both"         # Dual 12-spike diffraction sets: "both" (24 rays), "primary" (12 rays), "secondary" (12 rays)
  base_angles_deg: [23.55, 55.29, 80.25, 118.65, 142.88, 178.07]
  detector_alignment_offset_deg: -9.70
  angular_half_width_deg: 4.0
  spike_width_px: 4.0
  core_protection_radius_px:
    bright: 6.0
    medium: 4.0
    faint: 3.0
  morphological:
    threshold_sigma: 2.0
    min_length_px: 15
    dilation_iterations: 2
  contaminant_detection_sigma: 3.0
  contaminant_detector: "mto2" # Options: 'mto2', 'erosion_dilation'
  mto2:
    s_sigma: 1.6
    alpha: 1.0e-6
    move_factor: 0.1
    area_ratio: 0.90
    dilation_px: 2

profile:
  ellipticity: 0.0
  position_angle: 0.0
  sigma_clip: 3.0
  max_clip_iters: 5
  radial_step_px: 1.0
  num_workers: 8

assembly:
  canvas_size: 1025           # Canvas dimension: 1025x1025 or 2049x2049 (odd integer)
  stack_sigma_clip: 3.0
  oversampling_faint: 4       # Subpixel oversampling around 4x for faint tier core
  oversampling_medium: 4      # Subpixel oversampling around 4x for medium tier transition
  overlap_fm:
    r_min: 8.0
    r_max: 16.0
    blend_start: 10.0
    blend_end: 18.0
  overlap_mb:
    r_min: 22.0
    r_max: 45.0
    blend_start: 30.0
    blend_end: 48.0
  normalize_flux: true

validation:
  eval_stars_per_tier: 5
  core_radius_max_px: 10.0
  transition_radius_px: [10.0, 30.0]
  wings_radius_min_px: 30.0
  regularization_sigma: 3.0

reporting:
  generate_pdf: true
  report_path: "output/roman_epsf_commissioning_report.pdf"
  dpi: 300
