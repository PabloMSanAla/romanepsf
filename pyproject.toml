[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "romanepsf"
version = "0.1.0"
description = "Roman Space Telescope Extended PSF (ePSF) Measurement Pipeline"
requires-python = ">=3.10"
license = {text = "BSD-3-Clause"}
authors = [
    {name = "Roman ePSF Team"}
]
keywords = ["astronomy", "roman", "wfi", "psf", "epsf", "space telescope"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "astropy>=5.3.0",
    "photutils>=1.8.0",
    "roman_datamodels>=0.19.0",
    "asdf>=2.15.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "click>=8.0.0",
    "matplotlib>=3.7.0",
    "torch>=2.0.0",
    "gwcs>=0.19.0",
    "pyarrow>=10.0.0",
    "astropy-healpix>=1.0.0",
    "astroquery>=0.4.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
mto2 = [
    "higra>=0.6.0",
]
all = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "higra>=0.6.0",
]

[project.scripts]
romanepsf = "romanepsf.cli:cli"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["romanepsf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
