name: romanepsf-dev
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - pip>=24.0
  - setuptools
  - wheel
  # Core scientific & astronomy libraries
  - numpy>=1.24.0
  - scipy>=1.10.0
  - pandas>=2.0.0
  - matplotlib>=3.7.0
  - astropy>=5.3.0
  - photutils>=1.8.0
  - astroquery>=0.4.7
  - gwcs>=0.19.0
  - asdf>=2.15.0
  - asdf-astropy
  - bottleneck>=1.3.5
  - pyyaml>=6.0
  - click>=8.0.0
  - tqdm>=4.65.0
  # Jupyter notebook environment
  - jupyterlab
  - ipykernel
  - nbconvert
  - nbformat
  # Pip-specific dependencies and local editable repositories
  - pip:
      - torch>=2.0.0
      - torchvision
      - roman_datamodels>=0.19.0
      - romanisim>=0.14.0
      - stpsf>=2.0.0
      - opencv-python
      # Local package dependencies in editable mode
      - -e /Users/pmsanch1/code/ROSALIA
      - -e .
